<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Single-HTML-file build (see vite.singlefile.config.ts): the whole app
      is one inline <script>, so script-src needs 'unsafe-inline'; the ONNX
      Runtime wasm-loader glue is imported from a data: URL (there is no
      "/ort/" to serve it from -- see ortWasmConfig.inline.ts), so script-src
      and connect-src both need data: too. This is a materially looser CSP
      than index.html's; that's an acceptable trade for a file that is, by
      construction, entirely self-contained -- there is no third-party
      content it could ever load even without the CSP.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:"
    />
    <title>個人情報マスキングツール</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.singlefile.tsx"></script>
  </body>
</html>
